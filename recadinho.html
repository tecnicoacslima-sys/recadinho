<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recadinho Térmico</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f7b6c">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="./qrcode.js"></script>
<script src="./pdf.min.js"></script>
<script src="./jsQR.js"></script>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--txt:#1d2433;--sub:#5b6577;--pri:#0f7b6c;--pri2:#0b5e53;--bd:#d8dee6;--err:#b3261e;--okbg:#e6f4f1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
  header{background:var(--pri);color:#fff;padding:14px 16px}
  header h1{margin:0;font-size:1.15rem}
  header small{opacity:.85}
  main{max-width:520px;margin:0 auto;padding:14px 16px 40px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h2{font-size:.95rem;margin:0 0 4px}
  label{display:block;font-size:.85rem;color:var(--sub);margin:8px 0 4px}
  input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:1rem;font-family:inherit}
  textarea{min-height:120px;resize:vertical}
  .chk{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.95rem;color:var(--txt)}
  .chk input{width:22px;height:22px;flex:none}
  .chk.off{opacity:.5}
  button{width:100%;padding:13px;border:0;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:8px}
  .pri{background:var(--pri);color:#fff}.pri:active{background:var(--pri2)}
  .sec{background:#e7ecf1;color:var(--txt)}
  .mini{padding:9px;font-size:.9rem}
  button:disabled{opacity:.5}
  #status{font-weight:600;margin:0}
  .ok{color:var(--pri)}.bad{color:var(--err)}
  .prev{display:flex;justify-content:center;background:#e9ecef;padding:10px;border-radius:8px}
  canvas{width:100%;max-width:288px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  details{font-size:.8rem;color:var(--sub)}
  pre{white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;background:#111;color:#9fe;padding:8px;border-radius:6px}
  .row{display:flex;gap:8px}.row>*{flex:1}
  #laudoInfo{display:none;margin-top:10px;padding:10px;border-radius:8px;font-size:.88rem;line-height:1.4}
  #laudoInfo.ok{display:block;background:var(--okbg);color:var(--pri2)}
  #laudoInfo.bad{display:block;background:#fdecea;color:var(--err)}
  #arqPdf{display:none}
</style>
</head>
<body>
<header>
  <h1>🧾 Recadinho Térmico</h1>
  <small>Impressora SC03h · 57 mm</small>
</header>
<main>
  <div class="card">
    <p id="status" class="bad">● Desconectada</p>
    <button id="btnCon" class="pri">Conectar impressora</button>
  </div>

  <div class="card">
    <h2>Laudo APAC</h2>
    <input type="file" id="arqPdf" accept="application/pdf,.pdf">
    <div class="row">
      <button id="btnLaudo" class="sec" type="button">📄 Importar laudo (PDF)</button>
      <button id="btnLimpar" class="sec mini" type="button" style="flex:0 0 30%">Limpar</button>
    </div>
    <div id="laudoInfo"></div>
  </div>

  <div class="card">
    <label for="cab">Cabeçalho (fica salvo)</label>
    <input id="cab" value="ESF Flor do Cerrado">
    <label for="pac">Paciente</label>
    <input id="pac">
    <label for="proc">Procedimento</label>
    <input id="proc">
    <label for="pront">Nº Prontuário</label>
    <input id="pront" inputmode="numeric">
    <label for="msg">Recado</label>
    <textarea id="msg" placeholder="Digite o recado aqui..."></textarea>
    <label class="chk off" id="chkQr"><input type="checkbox" id="usarQr" disabled> Incluir QR Code do laudo</label>
    <div class="row">
      <div>
        <label for="fonte">Tamanho da letra</label>
        <select id="fonte"><option value="22">Pequena</option><option value="26" selected>Média</option><option value="32">Grande</option></select>
      </div>
      <div>
        <label for="int">Intensidade</label>
        <select id="int"><option value="8000">Clara</option><option value="12000" selected>Normal</option><option value="18000">Escura</option></select>
      </div>
    </div>
    <button id="btnPrint" class="pri" disabled>Imprimir</button>
    <button id="btnTeste" class="sec" disabled>Imprimir teste</button>
  </div>

  <details class="card">
    <summary>Ajustes do QR Code</summary>
    <label for="qrTxt">Frase acima do QR (fica salva)</label>
    <input id="qrTxt" value="Acompanhe sua APAC:">
    <label for="qrTam">Tamanho do QR</label>
    <select id="qrTam"><option value="160">Pequeno</option><option value="220" selected>Médio</option><option value="300">Grande</option></select>
  </details>

  <div class="card">
    <label>Pré-visualização</label>
    <div class="prev"><canvas id="cv" width="384" height="100"></canvas></div>
  </div>

  <details class="card">
    <summary>Diagnóstico (para enviar ao Claude se der erro)</summary>
    <pre id="log"></pre>
  </details>
</main>

<script>
const W = 384; // 48 mm úteis a 203 dpi
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(...a){ logEl.textContent += a.join(' ') + '\n'; logEl.scrollTop = logEl.scrollHeight; }

if (typeof pdfjsLib !== 'undefined') pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js';

// ---------- Campos que ficam salvos ----------
const SALVOS = ['cab', 'qrTxt', 'qrTam', 'fonte', 'int'];
for (const id of SALVOS) {
  const el = $(id);
  try { const v = localStorage.getItem('rt_' + id); if (v !== null) el.value = v; } catch(e){}
  el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
    try { localStorage.setItem('rt_' + id, el.value); } catch(e){}
  });
}
// Remove o antigo QR fixo, que não deve mais ser usado
try { ['rt_qrImg', 'rt_qrLink', 'rt_usarQr', 'cab'].forEach(k => localStorage.removeItem(k)); } catch(e){}

// ---------- Laudo importado (só na memória, nunca salvo) ----------
let laudoLink = '';

function mostrarLaudo(tipo, html){
  const el = $('laudoInfo');
  el.className = tipo; el.innerHTML = html;
}

function setQrDisponivel(on){
  $('usarQr').disabled = !on;
  $('usarQr').checked = on;
  $('chkQr').classList.toggle('off', !on);
}

function limparLaudo(){
  laudoLink = '';
  $('pac').value = ''; $('proc').value = ''; $('pront').value = ''; $('msg').value = '';
  setQrDisponivel(false);
  $('laudoInfo').className = ''; $('laudoInfo').textContent = '';
  desenhar('recado');
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Lê os campos do laudo do CELK pela posição dos textos na página
function lerCampos(itens){
  const achar = re => itens.filter(i => re.test(i.s)).sort((a, b) => a.y - b.y)[0];
  const abaixo = (re, larg) => {
    const l = achar(re); if (!l) return '';
    const c = itens.filter(i => i !== l && i.y > l.y + 3 && i.y < l.y + 22 && i.x > l.x - 20 && i.x < l.x + larg)
                   .sort((a, b) => (a.y - b.y) || (a.x - b.x));
    if (!c.length) return '';
    const y0 = c[0].y;
    return c.filter(i => Math.abs(i.y - y0) < 3).sort((a, b) => a.x - b.x).map(i => i.s).join(' ').trim();
  };
  const linhaProc = abaixo(/^C[óo]d\.?\s*Proc/i, 420);
  const m = linhaProc.match(/^(\d{2}\.\d{2}\.\d{2}\.\d{3}-\d)\s*(.*)$/);
  return {
    paciente: abaixo(/^Nome do Paciente$/i, 260),
    prontuario: (abaixo(/^N[º°o]\.?\s*Prontu[áa]rio/i, 140).match(/\d+/) || [''])[0],
    procedimento: m ? m[2] : linhaProc,
    data: abaixo(/^Data da Solicita/i, 120),
  };
}

function lerQrDoCanvas(cv){
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  // 1º: canto superior direito (onde o CELK coloca o QR); 2º: página inteira
  const areas = [
    [Math.floor(cv.width * 0.55), 0, Math.ceil(cv.width * 0.45), Math.ceil(cv.height * 0.32)],
    [0, 0, cv.width, cv.height]
  ];
  for (const [x, y, w, h] of areas) {
    const d = ctx.getImageData(x, y, w, h);
    const r = jsQR(d.data, w, h);
    if (r && r.data) return r.data;
  }
  return '';
}

async function importarLaudo(file){
  if (typeof pdfjsLib === 'undefined' || typeof jsQR === 'undefined') {
    alert('Os leitores de PDF/QR não carregaram. Recarregue a página com internet.'); return;
  }
  const btn = $('btnLaudo');
  btn.disabled = true; btn.textContent = '⏳ Lendo laudo...';
  limparLaudo();
  try {
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const page = await pdf.getPage(1);

    // Texto
    const vp1 = page.getViewport({ scale: 1 });
    const tc = await page.getTextContent();
    const itens = tc.items.filter(i => i.str && i.str.trim())
      .map(i => ({ s: i.str.trim(), x: i.transform[4], y: vp1.height - i.transform[5] }));
    const campos = itens.length ? lerCampos(itens) : { paciente: '', procedimento: '', prontuario: '', data: '' };

    // QR Code
    const vp = page.getViewport({ scale: 2.5 });
    const cv = document.createElement('canvas');
    cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    const c2 = cv.getContext('2d', { willReadFrequently: true });
    c2.fillStyle = '#fff'; c2.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: c2, viewport: vp }).promise;
    const link = lerQrDoCanvas(cv);
    cv.width = cv.height = 0; // libera memória

    if (campos.paciente) $('pac').value = campos.paciente;
    if (campos.procedimento) $('proc').value = campos.procedimento;
    if (campos.prontuario) $('pront').value = campos.prontuario;
    log('Laudo lido:', itens.length, 'textos;', link ? 'QR encontrado' : 'sem QR');

    if (link) { laudoLink = link; setQrDisponivel(true); }

    if (!itens.length && !link) {
      mostrarLaudo('bad', 'Este laudo parece ser <b>digitalizado</b> (foto do papel): não tem QR nem texto para ler. Preencha os campos à mão.');
    } else {
      const linhas = [];
      if (campos.paciente) linhas.push('<b>' + esc(campos.paciente) + '</b>');
      if (campos.procedimento) linhas.push(esc(campos.procedimento));
      if (campos.prontuario) linhas.push('Prontuário ' + esc(campos.prontuario));
      if (campos.data) linhas.push('Solicitado em ' + esc(campos.data));
      linhas.push(link ? '✓ QR Code do laudo encontrado' : '⚠ Não encontrei QR Code neste laudo');
      mostrarLaudo(link ? 'ok' : 'bad', linhas.join('<br>'));
    }
  } catch(e) {
    log('Erro ao ler PDF:', e.message);
    mostrarLaudo('bad', 'Não consegui abrir este PDF. Confira se é o laudo APAC do CELK.');
  }
  btn.disabled = false; btn.textContent = '📄 Importar laudo (PDF)';
  desenhar('recado');
}

$('btnLaudo').onclick = () => $('arqPdf').click();
$('arqPdf').addEventListener('change', ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (f) importarLaudo(f);
});
$('btnLimpar').onclick = limparLaudo;

// ---------- Protocolo "cat printer" ----------
const CRC = (() => { const t = new Uint8Array(256); for (let i = 0; i < 256; i++) { let c = i; for (let j = 0; j < 8; j++) c = (c & 0x80) ? ((c << 1) ^ 0x07) & 0xff : (c << 1) & 0xff; t[i] = c; } return t; })();
const crc8 = d => { let c = 0; for (const b of d) c = CRC[(c ^ b) & 0xff]; return c; };
const pkt = (cmd, data) => new Uint8Array([0x51, 0x78, cmd, 0x00, data.length & 0xff, data.length >> 8, ...data, crc8(data), 0xff]);
const u16 = n => [n & 0xff, (n >> 8) & 0xff];

const CMD = {
  estado:    () => pkt(0xA3, [0x00]),
  qualidade: () => pkt(0xA4, [0x33]),
  energia:  e => pkt(0xAF, u16(e)),
  aplicar:   () => pkt(0xBE, [0x01]),
  atualizar: () => pkt(0xA9, [0x00]),
  velocidade: v => pkt(0xBD, [v]),
  latIni:    () => pkt(0xA6, [0xAA,0x55,0x17,0x38,0x44,0x5F,0x5F,0x5F,0x44,0x38,0x2C]),
  latFim:    () => pkt(0xA6, [0xAA,0x55,0x17,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x17]),
  linha:   bytes => pkt(0xA2, bytes),
  avancar:   n => pkt(0xA1, u16(n)),
};

// ---------- Bluetooth ----------
let dev = null, txChar = null, pausado = false, chunk = 180;
const SERVICOS = [0xAE30, 0xAF30, 0xFF00, 0xFFE0, 0x18F0];
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function conectar(){
  if (!navigator.bluetooth) { alert('Este navegador não tem Bluetooth web. Use o Google Chrome no Android.'); return; }
  try {
    dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: SERVICOS });
    log('Dispositivo:', dev.name);
    dev.addEventListener('gattserverdisconnected', () => { setStatus(false); log('Desconectou.'); });
    const srv = await dev.gatt.connect();
    const servicos = await srv.getPrimaryServices();
    txChar = null;
    for (const s of servicos) {
      log('Serviço', s.uuid);
      for (const c of await s.getCharacteristics()) {
        const p = c.properties;
        log('  carac.', c.uuid, p.write ? 'write' : '', p.writeWithoutResponse ? 'writeNR' : '', p.notify ? 'notify' : '');
        if (!txChar && (c.uuid.startsWith('0000ae01') || c.uuid.startsWith('0000ff02')) && (p.write || p.writeWithoutResponse)) txChar = c;
        if (p.notify && (c.uuid.startsWith('0000ae02') || c.uuid.startsWith('0000ff01'))) {
          try {
            await c.startNotifications();
            c.addEventListener('characteristicvaluechanged', ev => {
              const v = new Uint8Array(ev.target.value.buffer);
              if (v[2] === 0xAE) pausado = v[6] === 0x10;
              log('<-', [...v].map(b => b.toString(16).padStart(2,'0')).join(' '));
            });
          } catch(e){ log('notify falhou', e.message); }
        }
      }
    }
    if (!txChar) { log('ERRO: não achei a característica de escrita.'); alert('Conectou, mas não reconheci o modelo. Abra "Diagnóstico" e me mande o texto.'); return; }
    log('Escrevendo em', txChar.uuid);
    setStatus(true);
  } catch(e) { log('Erro ao conectar:', e.message); alert('Não conectou: ' + e.message); }
}

function setStatus(on){
  $('status').textContent = on ? '● Conectada: ' + (dev?.name || '') : '● Desconectada';
  $('status').className = on ? 'ok' : 'bad';
  $('btnPrint').disabled = $('btnTeste').disabled = !on;
  $('btnCon').textContent = on ? 'Reconectar' : 'Conectar impressora';
}

async function enviar(bytes){
  for (let i = 0; i < bytes.length; i += chunk) {
    while (pausado) await sleep(50);
    const parte = bytes.slice(i, i + chunk);
    try {
      if (txChar.properties.writeWithoutResponse) await txChar.writeValueWithoutResponse(parte);
      else await txChar.writeValue(parte);
    } catch(e) {
      if (chunk > 20) { log('Pacote grande falhou, usando 20 bytes'); chunk = 20; i -= chunk; continue; }
      throw e;
    }
  }
}

// ---------- QR Code ----------
function gerarQr(texto){
  if (typeof qrcode === 'undefined') return null;
  try {
    qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
    const qr = qrcode(0, 'M');
    qr.addData(texto);
    qr.make();
    return qr;
  } catch(e) { log('Erro no QR:', e.message); return null; }
}

// ---------- Desenho do cupom ----------
function quebrar(ctx, texto, larg){
  const linhas = [];
  for (const par of texto.split('\n')) {
    if (!par.trim()) { linhas.push(''); continue; }
    let atual = '';
    for (const pal of par.split(/\s+/)) {
      const t = atual ? atual + ' ' + pal : pal;
      if (ctx.measureText(t).width <= larg) atual = t;
      else { if (atual) linhas.push(atual); atual = pal; }
    }
    linhas.push(atual);
  }
  return linhas;
}

// modo: 'recado' | 'teste'
function desenhar(modo){
  const cv = $('cv'), ctx = cv.getContext('2d');
  const fs = +$('fonte').value, m = 8, larg = W - m * 2;
  const agora = new Date();
  const dataHora = agora.toLocaleDateString('pt-BR') + '  ' + agora.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  const blocos = [];

  if (modo === 'teste') {
    blocos.push(['b', 30, 'TESTE OK!']);
    blocos.push(['n', 22, 'Se você está lendo isto, o app conversa com a impressora.']);
    blocos.push(['n', 22, dataHora]);
  } else {
    const pac = $('pac').value.trim(), proc = $('proc').value.trim(), pront = $('pront').value.trim();
    if ($('cab').value.trim()) blocos.push(['b', fs + 2, $('cab').value.trim()]);
    blocos.push(['n', fs - 4, dataHora]);
    blocos.push(['hr']);
    if (pac) blocos.push(['b', fs, 'Paciente: ' + pac]);
    if (proc) blocos.push(['n', fs - 2, proc]);
    if (pront) blocos.push(['b', fs, 'Prontuário: ' + pront]);
    if (pac || proc || pront) blocos.push(['sp']);
    blocos.push(['n', fs, $('msg').value || '(recado vazio)']);
    if ($('usarQr').checked && laudoLink) {
      const q = gerarQr(laudoLink);
      if (q) {
        blocos.push(['hr']);
        if ($('qrTxt').value.trim()) blocos.push(['c', fs - 2, $('qrTxt').value.trim()]);
        blocos.push(['qr', q]);
      }
    }
  }

  const alvo = +$('qrTam').value;
  const prep = []; let h = m;
  for (const b of blocos) {
    if (b[0] === 'hr') { prep.push(b); h += 14; continue; }
    if (b[0] === 'sp') { prep.push(b); h += 8; continue; }
    if (b[0] === 'qr') {
      const n = b[1].getModuleCount();
      const mod = Math.max(2, Math.floor(alvo / n));
      const lado = mod * n;
      prep.push(['qr', b[1], mod, lado]); h += lado + 10; continue;
    }
    const negrito = b[0] === 'b' || b[0] === 'cb';
    ctx.font = (negrito ? 'bold ' : '') + b[1] + 'px Arial, sans-serif';
    const ls = quebrar(ctx, b[2], larg);
    prep.push([b[0], b[1], ls]); h += ls.length * Math.round(b[1] * 1.25) + 4;
  }
  h += m;
  cv.height = h;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, h);
  ctx.fillStyle = '#000'; ctx.textBaseline = 'top';
  let y = m;
  for (const b of prep) {
    if (b[0] === 'hr') { ctx.fillRect(m, y + 5, larg, 2); y += 14; continue; }
    if (b[0] === 'sp') { y += 8; continue; }
    if (b[0] === 'qr') {
      const [, qr, mod, lado] = b;
      const x0 = Math.floor((W - lado) / 2), n = qr.getModuleCount();
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
        if (qr.isDark(r, c)) ctx.fillRect(x0 + c * mod, y + r * mod, mod, mod);
      y += lado + 10; continue;
    }
    const centro = b[0] === 'c' || b[0] === 'cb';
    const negrito = b[0] === 'b' || b[0] === 'cb';
    ctx.font = (negrito ? 'bold ' : '') + b[1] + 'px Arial, sans-serif';
    ctx.textAlign = centro ? 'center' : 'left';
    for (const l of b[2]) { ctx.fillText(l, centro ? W / 2 : m, y); y += Math.round(b[1] * 1.25); }
    y += 4;
  }
  ctx.textAlign = 'left';
  return cv;
}

function bitmapLinhas(cv){
  const ctx = cv.getContext('2d');
  const px = ctx.getImageData(0, 0, W, cv.height).data;
  const linhas = [];
  for (let y = 0; y < cv.height; y++) {
    const row = new Uint8Array(W / 8);
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const lum = 0.299 * px[i] + 0.587 * px[i+1] + 0.114 * px[i+2];
      if (lum < 128) row[x >> 3] |= 1 << (x & 7);
    }
    linhas.push(row);
  }
  return linhas;
}

async function imprimir(modo){
  if (!txChar) return;
  const btns = [$('btnPrint'), $('btnTeste')];
  btns.forEach(b => b.disabled = true);
  let ok = false;
  try {
    const cv = desenhar(modo);
    const linhas = bitmapLinhas(cv);
    log('Imprimindo', linhas.length, 'linhas');
    const partes = [CMD.estado(), CMD.qualidade(), CMD.energia(+$('int').value), CMD.aplicar(), CMD.atualizar(), CMD.velocidade(32), CMD.latIni()];
    for (const p of partes) await enviar(p);
    let buf = [];
    for (let i = 0; i < linhas.length; i++) {
      buf.push(...CMD.linha(linhas[i]));
      if (buf.length >= chunk * 4 || i === linhas.length - 1) { await enviar(new Uint8Array(buf)); buf = []; await sleep(15); }
    }
    for (const p of [CMD.latFim(), CMD.avancar(90), CMD.velocidade(8), CMD.estado()]) await enviar(p);
    log('Enviado.');
    ok = true;
  } catch(e) { log('Erro ao imprimir:', e.message); alert('Erro: ' + e.message); }
  btns.forEach(b => b.disabled = false);
  // Depois de imprimir, limpa tudo do paciente para não ir para o próximo recado
  if (ok && modo === 'recado') limparLaudo(); else desenhar('recado');
}

$('btnCon').onclick = conectar;
$('btnPrint').onclick = () => imprimir('recado');
$('btnTeste').onclick = () => imprimir('teste');
['cab','pac','proc','pront','msg','fonte','qrTxt','qrTam','usarQr'].forEach(id => {
  const el = $(id);
  el.addEventListener(el.tagName === 'SELECT' || el.type === 'checkbox' ? 'change' : 'input', () => desenhar('recado'));
});
desenhar('recado');

// ---------- App instalável (ícone na tela inicial) ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => log('Service worker:', e.message));
  });
}
</script>
